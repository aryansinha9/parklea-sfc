<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Parklea SFC — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/admin-lurVQMk0.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/admin-D3o3I7YL.css">
</head>
<body class="admin-body">

<!-- ============== NOT CONFIGURED ============== -->
<div id="viewUnconfigured" class="admin-center" hidden>
  <div class="admin-card">
    <img src="/assets/logo-colour-D74ovN4q.png" alt="Parklea SFC" class="admin-logo" />
    <h1>Admin not configured</h1>
    <p>Supabase environment variables are missing. Add <code>VITE_SUPABASE_URL</code> and <code>VITE_SUPABASE_ANON_KEY</code> to your <code>.env</code> file (and to Vercel), then rebuild.</p>
  </div>
</div>

<!-- ============== LOGIN ============== -->
<div id="viewLogin" class="admin-center" hidden>
  <div class="admin-card">
    <img src="/assets/logo-colour-D74ovN4q.png" alt="Parklea SFC" class="admin-logo" />
    <h1>Admin Login</h1>
    <p class="admin-sub">Sign in to manage website content.</p>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username" required />
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required />
      <div id="loginError" class="admin-error" hidden></div>
      <button type="submit" class="admin-btn primary" id="loginBtn">Sign In</button>
    </form>
    <a class="admin-back" href="/">← Back to website</a>
  </div>
</div>

<!-- ============== DASHBOARD ============== -->
<div id="viewDashboard" class="admin-shell" hidden>
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <img src="/assets/logo-colour-D74ovN4q.png" alt="Parklea SFC" />
      <div>
        <div class="admin-brand-name">Parklea SFC</div>
        <div class="admin-brand-sub">Content Admin</div>
      </div>
    </div>
    <nav class="admin-nav" id="adminNav">
      <button data-tab="quick_links" class="active">Quick Links</button>
      <button data-tab="sponsors">Sponsors</button>
      <button data-tab="life_members">Life Members</button>
      <button data-tab="committee">Committee</button>
      <button data-tab="policies">Policies &amp; Regulations</button>
    </nav>
    <div class="admin-sidebar-foot">
      <a href="/" target="_blank" rel="noopener">View website ↗</a>
      <button id="signOutBtn">Sign out</button>
    </div>
  </aside>
  <main class="admin-main">
    <header class="admin-main-head">
      <h2 id="tabTitle">Quick Links</h2>
      <p id="tabHint"></p>
    </header>
    <div id="tabContent"></div>
  </main>
</div>

<div id="toast" class="admin-toast" hidden></div>

</body>
</html>
